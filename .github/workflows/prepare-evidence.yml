name: Prepare toolchain and baseline evidence

on:
  push:
    branches: ['feat/animation-audit-20261002']

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare verified toolchain and chapter baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install latest checksum-verified stable Godot and Blender
        run: |
          python3 tools/install_toolchain.py --destination "$RUNNER_TEMP/jade-tools"
          echo "$RUNNER_TEMP/jade-tools" >> "$GITHUB_PATH"
          cp "$RUNNER_TEMP/jade-tools/toolchain.json" docs/audit/toolchain.json
      - name: Verify Blender runs without a display
        run: blender --background --factory-startup --python-expr "import bpy; print('BLENDER_HEADLESS_PASS', bpy.app.version_string)"
      - name: Record chapter briefing defects and expose a source image for inspection
        run: |
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          index=json.loads(Path('content/campaign/index.json').read_text())
          books={name:json.loads((Path('content/campaign')/name).read_text()) for name in index['book_hashes']}
          cases=[]
          for quest in index['quests']:
              page=books[quest['book']][quest['id']]
              premature_return='Lin Yue returns through ' in page['story']
              cases.append({'id':quest['id'], 'passed':not premature_return, 'reason':'Uncompleted chapter briefing contains a successful return and aftermath' if premature_return else ''})
          Path('docs/audit/chapter-state-baseline.json').write_text(json.dumps({'baseline':'7ead85632d59503f37918c5f6660314cc6d7931a', 'checks':len(cases), 'failed':sum(not c['passed'] for c in cases), 'root_causes':1, 'cases':cases},indent=2)+'\n')
          source=Path('assets/sprites/hires/npc_0.png')
          encoded=base64.b64encode(source.read_bytes()).decode()
          Path('docs/audit/source-atlas.b64').write_text('\n'.join(encoded[i:i+4096] for i in range(0,len(encoded),4096))+'\n')
          print('CHAPTER_BASELINE',len(cases),sum(not c['passed'] for c in cases))
          PY
      - name: Preserve inspection evidence on the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/toolchain.json docs/audit/chapter-state-baseline.json docs/audit/source-atlas.b64
          git commit -m "Record toolchain installation and chapter baseline"
          git push origin HEAD
