name: Game checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation and screenshot dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libegl1 libxinerama1 libxcursor1 libxi6 libxrandr2
      - name: Install checksum-verified Godot 4.7.2
        run: |
          bash tools/install_godot.sh "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Verify committed campaign and animation resources reproduce
        run: |
          python3 tools/compile_campaign.py
          python3 tools/register_sprites.py
          python3 tools/register_hires.py
          python3 tools/register_animation.py
          git diff --exit-code -- content/campaign assets/sprites
      - name: Validate content, assets, audit regressions, quests, and packaged game
        run: bash tools/check.sh
      - name: Render screenshots with the real game engine
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --audio-driver Dummy -- --capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-evidence
          path: |
            docs/screenshots/*.png
            docs/audit/*results.json
            docs/audit/toolchain.json
            docs/audit/chapter-state-ledger.csv
          if-no-files-found: error
