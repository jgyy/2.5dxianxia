name: Prepare exact quadrant references
on:
  push:
    branches: [work/sprite-inputs-20261002]
permissions:
  contents: write
jobs:
  references:
    if: github.event.head_commit.message == 'Prepare exact sprite quadrant references'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Extract source bytes for image-generation references
        run: |
          python - <<'PY'
          import base64,hashlib,io,json
          from pathlib import Path
          from PIL import Image
          source=Path("docs/asset-inputs")
          out=source/"quadrants";out.mkdir(exist_ok=True)
          records=[]
          for entry in json.loads((source/"index.json").read_text()):
              raw=base64.b64decode(Path(entry["encoded"]).read_text())
              image=Image.open(io.BytesIO(raw)).convert("RGBA")
              assert image.size==(1254,1254)
              for q in range(4):
                  x=q%2*627;y=q//2*627
                  reference=image.crop((x,y,x+627,y+627))
                  data=io.BytesIO();reference.save(data,"PNG")
                  path=out/(entry["source"].replace("/","__").removesuffix(".png")+f"__q{q}.png.txt")
                  path.write_text(base64.b64encode(data.getvalue()).decode()+"\n")
                  records.append({"source":entry["source"],"quadrant":q,"reference":str(path),"size":[627,627],"original_sha256":entry["sha256"],"pixel_sha256":hashlib.sha256(reference.tobytes()).hexdigest()})
          assert len(records)==88
          (out/"index.json").write_text(json.dumps(records,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/asset-inputs/quadrants
          git commit -m "Preserve 88 exact quadrant input references"
          git push origin HEAD:work/sprite-inputs-20261002
