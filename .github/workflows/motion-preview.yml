name: Blender animation preview
on:
  push:
    branches: [work/sprite-inputs-20261002]
permissions:
  contents: write
jobs:
  render:
    if: github.event.head_commit.message == 'Render animation preview with Blender'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Install official verified latest stable tools
        run: python tools/install_toolchain.py --destination "$RUNNER_TEMP/toolchain"
      - name: Build existing-cast plan and render 150 preview frames
        run: |
          python tools/build_motion_plan.py --output "$RUNNER_TEMP/plan.json"
          "$RUNNER_TEMP/toolchain/blender" --background --python tools/render_motion.py -- --plan "$RUNNER_TEMP/plan.json" --region region_00 --limit 3 --output "$RUNNER_TEMP/raw"
          python tools/pack_motion.py --input "$RUNNER_TEMP/raw" --output "$RUNNER_TEMP/packed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-preview
          path: |
            ${{ runner.temp }}/raw
            ${{ runner.temp }}/packed
            ${{ runner.temp }}/toolchain/toolchain.json
      - name: Preserve readable contact sheet and render metrics
        run: |
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          from PIL import Image
          raw=Path(os.environ["RUNNER_TEMP"])/"raw"
          packed=Path(os.environ["RUNNER_TEMP"])/"packed"
          out=Path("docs/asset-inputs")
          out.mkdir(exist_ok=True)
          im=Image.new("RGBA",(1280,1280))
          for r,state in enumerate([0,8,24,40]):
              for c in range(4):
                  frame=Image.open(raw/"npc_000"/f"{state+c:02}.png")
                  im.paste(frame,(c*320,r*320))
          im.save(out/"motion-preview.png")
          (out/"motion-preview.png.txt").write_text(base64.b64encode((out/"motion-preview.png").read_bytes()).decode()+"\n")
          (out/"motion-preview-report.json").write_bytes((packed/"render.json").read_bytes())
          (out/"motion-preview.png").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/asset-inputs
          git commit -m "Preserve animation preview evidence"
          git push origin HEAD:work/sprite-inputs-20261002
